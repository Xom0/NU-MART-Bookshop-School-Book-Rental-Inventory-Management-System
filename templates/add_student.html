{% extends 'base.html' %}{% block title %}Add student · Nu-Mart{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">STUDENT RECORD</p><h1>Add student</h1></div></div>
<form method="post" class="panel form-grid"><label>Student ID<input name="student_id" maxlength="40" required></label><label>First name<input name="first_name" maxlength="100" required></label><label>Last name<input name="last_name" maxlength="100" required></label><label>Grade<select name="grade">{% for grade in range(9,14) %}<option value="{{grade}}">{{grade}}</option>{% endfor %}</select></label><label>Class name<input name="class_name" maxlength="40" placeholder="9A" required></label><label>Enrolment status<select name="enrolment_status"><option>Active</option><option>Inactive</option></select></label><div class="form-actions"><button class="primary">Save student</button><a class="button light" href="{{url_for('pages.students')}}">Cancel</a></div></form>{% endblock %}
